<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chém Hoa Quả - Pika Cut</title>
  <style>
    body { margin: 0; background: #1a1a1a; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #fff; touch-action: none; }
    #controls { margin-bottom: 10px; display: flex; gap: 15px; align-items: center; background: #2a2a2a; padding: 10px 20px; border-radius: 8px; z-index: 10; }
    canvas { background: #222; border: 2px solid #555; cursor: crosshair; }
    button { padding: 8px 16px; background: #ff4757; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #ff6b81; }
  </style>
</head>
<body>

<div id="controls">
  <button onclick="spawnCluster()">Thả chùm quả</button>
  <label for="speedRange">Tốc độ:</label>
  <input type="range" id="speedRange" min="0.5" max="3" step="0.1" value="1">
  <span id="speedValue">1x</span>
  <span style="margin-left: 15px; font-weight: bold; color: #2ed573;" id="scoreBoard">Điểm: 0</span>
</div>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const speedInput = document.getElementById('speedRange');
  const speedDisplay = document.getElementById('speedValue');
  const scoreBoard = document.getElementById('scoreBoard');

  let speedMultiplier = 1;
  let score = 0;
  let fruits = [];
  let mouseTrail = [];

  const FRUIT_TYPES = [
    { name: 'Táo', emoji: '🍎', radius: 30 },
    { name: 'Dưa hấu', emoji: '🍉', radius: 40 },
    { name: 'Chuối', emoji: '🍌', radius: 30 },
    { name: 'Cam', emoji: '🍊', radius: 30 },
    { name: 'Dứa', emoji: '🍍', radius: 35 },
    { name: 'Dâu', emoji: '🍓', radius: 25 }
  ];

  speedInput.addEventListener('input', (e) => {
    speedMultiplier = parseFloat(e.target.value);
    speedDisplay.innerText = speedMultiplier + 'x';
  });

  class Fruit {
    constructor(x, y) {
      this.type = FRUIT_TYPES[Math.floor(Math.random() * FRUIT_TYPES.length)];
      this.x = x;
      this.y = y;
      this.radius = this.type.radius;
      this.baseFallSpeed = Math.random() * 2 + 2;
      this.angle = Math.random() * Math.PI * 2;
      this.rotationSpeed = (Math.random() - 0.5) * 0.08;
      
      this.sliced = false;
      // Tốc độ văng của 2 nửa khi bị chém
      this.sliceOffX = 0;
    }

    update() {
      this.y += this.baseFallSpeed * speedMultiplier;
      this.angle += this.rotationSpeed * speedMultiplier;

      if (this.sliced) {
        this.sliceOffX += 2; // Tách 2 nửa ra xa dần
      }
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);

      ctx.font = `${this.radius * 1.8}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (!this.sliced) {
        ctx.fillText(this.type.emoji, 0, 0);
      } else {
        // Vẽ 2 nửa bị cắt văng ra hai bên
        ctx.save();
        ctx.translate(-this.sliceOffX, 0);
        ctx.fillText(this.type.emoji, 0, 0);
        ctx.restore();

        ctx.save();
        ctx.translate(this.sliceOffX, 0);
        ctx.fillText(this.type.emoji, 0, 0);
        ctx.restore();
      }

      ctx.restore();
    }
  }

  function spawnCluster() {
    const clusterSize = Math.floor(Math.random() * 3) + 3;
    const startX = Math.random() * (canvas.width - 200) + 100;

    for (let i = 0; i < clusterSize; i++) {
      const offsetX = (Math.random() - 0.5) * 140;
      const offsetY = -Math.random() * 120 - 50;
      fruits.push(new Fruit(startX + offsetX, offsetY));
    }
  }

  // --- LẮNG NGHE THAO TÁC CHÉM (CHUỘT & CẢM ỨNG) ---
  function addTrailPoint(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    mouseTrail.push({ x, y });
    if (mouseTrail.length > 8) mouseTrail.shift();
  }

  canvas.addEventListener('mousemove', (e) => {
    if (e.buttons === 1) addTrailPoint(e.clientX, e.clientY);
  });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    addTrailPoint(touch.clientX, touch.clientY);
  }, { passive: false });

  // --- VẼ ĐƯỜNG KIẾM & XỬ LÝ VA CHẠM ---
  function handleInteractions() {
    // Vẽ vệt chém
    if (mouseTrail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(mouseTrail[0].x, mouseTrail[0].y);
      for (let i = 1; i < mouseTrail.length; i++) {
        ctx.lineTo(mouseTrail[i].x, mouseTrail[i].y);
      }
      ctx.strokeStyle = '#00d2d3';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // Kiểm tra chém quả
    for (let f of fruits) {
      if (f.sliced) continue;
      for (let p of mouseTrail) {
        let dist = Math.hypot(f.x - p.x, f.y - p.y);
        if (dist < f.radius) {
          f.sliced = true;
          score += 10;
          scoreBoard.innerText = `Điểm: ${score}`;
          break;
        }
      }
    }

    // Giảm dần đường vệt chém
    if (Math.random() < 0.3 && mouseTrail.length > 0) {
      mouseTrail.shift();
    }
  }

  function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = fruits.length - 1; i >= 0; i--) {
      let f = fruits[i];
      f.update();
      f.draw();

      if (f.y - f.radius > canvas.height) {
        fruits.splice(i, 1);
      }
    }

    handleInteractions();
    requestAnimationFrame(gameLoop);
  }

  setInterval(() => {
    if (Math.random() < 0.5) spawnCluster();
  }, 2500);

  gameLoop();
</script>
</body>
</html>
