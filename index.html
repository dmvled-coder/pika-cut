<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ngăn Thú Dữ Tấn Công</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
        #app-container { width: 100vw; height: 100vh; max-width: 500px; margin: 0 auto; position: relative; background-color: #2b3a42; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1e3c72, #2a5298); z-index: 100; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 30px 20px; text-align: center; }
        .title-box h1 { font-size: 26px; color: #f1c40f; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); margin-bottom: 8px; text-transform: uppercase; }
        .title-box p { font-size: 14px; color: #ecf0f1; opacity: 0.9; }
        .section-label { font-size: 16px; font-weight: bold; color: #e0e0e0; margin-bottom: 12px; }
        
        .character-display { display: flex; justify-content: space-around; width: 100%; gap: 10px; }
        .char-card-show { flex: 1; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(241, 196, 15, 0.4); border-radius: 12px; padding: 12px 5px; }
        .char-img-preview { width: 45px; height: 45px; object-fit: contain; margin-bottom: 5px; }
        .char-name { font-size: 14px; font-weight: bold; display: block; }

        .options-box { background: rgba(0, 0, 0, 0.25); padding: 15px; border-radius: 12px; width: 100%; }
        .option-group { margin-bottom: 12px; }
        .option-group:last-child { margin-bottom: 0; }
        .speed-btn-group { display: flex; gap: 8px; }
        .speed-btn { flex: 1; padding: 8px 0; background: #34495e; border: none; border-radius: 6px; color: #fff; font-size: 13px; font-weight: bold; cursor: pointer; }
        .speed-btn.active { background: #e67e22; }
        .btn-start { margin-bottom: 50px; width: 100%; padding: 16px; background: #27ae60; border: none; border-radius: 30px; color: white; font-size: 18px; font-weight: bold; text-transform: uppercase; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.4); cursor: pointer; }
        .btn-start:active { transform: scale(0.98); }
        #header-zone { height: 10vh; background-color: #34495e; display: flex; flex-direction: column; justify-content: space-between; padding: 6px 0 0 0; border-bottom: 3px solid #2c3e50; position: relative; z-index: 10; }
        .hud-top-bar { display: flex; align-items: center; justify-content: space-between; padding: 0 12px; }
        .hud-info { display: flex; align-items: center; gap: 8px; }
        .selected-avatar { width: 34px; height: 34px; background: #2c3e50; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #f1c40f; overflow: hidden; }
        .selected-avatar img { width: 80%; height: 80%; object-fit: contain; }
        .char-title-text { font-size: 14px; font-weight: bold; color: #f1c40f; }
        .inventory-box { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 16px; border: 1px solid #f1c40f; }
        .shield-icon { width: 16px; height: 16px; object-fit: contain; }
        .shield-count { font-size: 14px; font-weight: bold; color: #f1c40f; }
        .doors-grid-bar { display: grid; width: 100%; height: 32px; align-items: flex-end; }
        .door-slot { display: flex; justify-content: center; align-items: flex-end; height: 100%; }
        .door { width: 85%; height: 28px; background: #7f8c8d; border: 2px solid #bdc3c7; border-bottom: none; border-radius: 4px 4px 0 0; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; color: #2c3e50; transition: all 0.3s; }
        .door.open { background: #e74c3c; border-color: #c0392b; color: #fff; height: 32px; }
        
        #game-canvas { height: 80vh; width: 100%; display: block; background-color: #556b2f; cursor: pointer; }

        #bottom-zone { height: 10vh; background-color: #8e44ad; border-top: 3px solid #9b59b6; display: flex; align-items: center; justify-content: space-around; padding: 0 10px; }
        .coop { display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(0,0,0,0.2); padding: 6px 16px; border-radius: 12px; width: 100%; height: 80%; }
        .coop-icon { font-size: 28px; }
        .coop-text { font-size: 14px; font-weight: bold; color: #f39c12; text-transform: uppercase; letter-spacing: 1px; }
        #result-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.25); z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: flex-start; padding: 20px; text-align: center; }
        .result-box { margin-top: 50px; background: rgba(44, 62, 80, 0.50); backdrop-filter: blur(4px); border-radius: 16px; padding: 30px 20px; width: 90%; max-width: 320px; border: 2px solid rgba(241, 196, 15, 0.8); box-shadow: 0 0 20px rgba(241, 196, 15, 0.3); }
        .result-title { font-size: 26px; font-weight: bold; margin-bottom: 10px; }
        .result-title.win { color: #2ecc71; }
        .result-title.lose { color: #e74c3c; }
        .result-time { font-size: 16px; margin-bottom: 20px; color: #ecf0f1; }
        .btn-restart { width: 100%; padding: 12px; background: #3498db; border: none; border-radius: 20px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- 1. START SCREEN -->
        <div id="start-screen">
            <div class="title-box">
                <h1>Ngăn Thú Dữ</h1>
                <p>Bảo vệ chuồng gà khỏi thú dữ!</p>
            </div>

            <div style="width: 100%;">
                <div class="section-label">CÁC THÚ DỮ SẼ XUẤT HIỆN NGẪU NHIÊN</div>
                <div class="character-display">
                    <div class="char-card-show">
                        <img id="preview-cho" class="char-img-preview" alt="Chó">
                        <span class="char-name">Chó</span>
                    </div>
                    <div class="char-card-show">
                        <img id="preview-casau" class="char-img-preview" alt="Cá Sấu">
                        <span class="char-name">Cá Sấu</span>
                    </div>
                    <div class="char-card-show">
                        <img id="preview-gau" class="char-img-preview" alt="Gấu">
                        <span class="char-name">Gấu</span>
                    </div>
                </div>
            </div>

            <div class="options-box">
                <div class="option-group">
                    <div class="section-label" style="font-size:13px; margin-bottom:6px;">TỐC ĐỘ DI CHUYỂN</div>
                    <div class="speed-btn-group">
                        <button class="speed-btn active" onclick="setSpeed(600, this)">Chậm (6s)</button>
                        <button class="speed-btn" onclick="setSpeed(400, this)">Vừa (4s)</button>
                        <button class="speed-btn" onclick="setSpeed(250, this)">Nhanh (2.5s)</button>
                    </div>
                </div>
            </div>

            <button class="btn-start" onclick="startGame()">VÀO GAME</button>
        </div>

        <!-- 2. GAME SCREEN -->
        <div id="header-zone">
            <div class="hud-top-bar">
                <div class="hud-info">
                    <div class="selected-avatar">
                        <img id="hud-avatar-img" src="" alt="Avatar">
                    </div>
                    <span class="char-title-text" id="hud-char-name">---</span>
                </div>
                <div class="inventory-box">
                    <img id="hud-shield-img" class="shield-icon" src="" alt="Khiên">
                    <span class="shield-count" id="shield-count">2</span>
                </div>
            </div>

            <div class="doors-grid-bar" id="doors-grid-bar"></div>
        </div>

        <canvas id="game-canvas"></canvas>
        
        <!-- Bottom Zone -->
        <div id="bottom-zone">
            <div class="coop">
                <span class="coop-icon">🐔</span>
                <span class="coop-text">Chuồng Gà</span>
                <span class="coop-icon">🐥</span>
            </div>
        </div>

        <!-- Result Modal -->
        <div id="result-modal">
            <div class="result-box">
                <div class="result-title" id="result-title">THẮNG LỢI!</div>
                <div class="result-time" id="result-time">Thời gian: 0 giây</div>
                <button class="btn-restart" onclick="resetToStart()">CHƠI LẠI</button>
            </div>
        </div>
    </div>

    <script>
        const COLS = 10;
        const ROWS = 15;
        
        const spawnCols = [
            Math.floor(COLS * 0.2), 
            Math.floor(COLS * 0.5), 
            Math.floor(COLS * 0.8)
        ];

        // DANH SÁCH CHƯỚNG NGẠI VẬT
        const OBSTACLE_RANDOM_SRC = 'https://cdn-icons-png.flaticon.com/512/3504/3504827.png';
        const OBSTACLE_PLACED_SRC = 'https://cdn-icons-png.flaticon.com/512/929/929429.png';

        // DANH SÁCH NHÂN VẬT VÀ CÁC MẢNG KHUNG HÌNH (FRAMES) CỦA MỖI CON
        // Lưu ý: Các ảnh mặc định nên vẽ theo hướng ĐẦU HƯỚNG LÊN TRÊN (hoặc bạn điều chỉnh baseAngle tương ứng)
        const characters = [
            { 
                id: 'cho', 
                name: 'Chó', 
                baseAngle: 0, // 0 rad: Đầu hướng LÊN TRÊN theo ảnh gốc
                frames: [
                    'https://cdn-icons-png.flaticon.com/512/616/616408.png',
                    'https://cdn-icons-png.flaticon.com/512/616/616408.png',
                    'https://cdn-icons-png.flaticon.com/512/616/616408.png',
                    'https://cdn-icons-png.flaticon.com/512/616/616408.png'
                ] 
            },
            { 
                id: 'casau', 
                name: 'Cá Sấu', 
                baseAngle: 0,
                frames: [
                    'ca-sau.png',
                    'ca-sau.png',
                    'ca-sau.png'
                ] 
            },
            { 
                id: 'gau', 
                name: 'Gấu', 
                baseAngle: 0,
                frames: [
                    'https://cdn-icons-png.flaticon.com/512/616/616412.png',
                    'https://cdn-icons-png.flaticon.com/512/616/616412.png',
                    'https://cdn-icons-png.flaticon.com/512/616/616412.png',
                    'https://cdn-icons-png.flaticon.com/512/616/616412.png'
                ] 
            }
        ];

        // Nạp sẵn ảnh chướng ngại vật
        const randomObstacleImg = new Image();
        randomObstacleImg.src = OBSTACLE_RANDOM_SRC;

        const placedObstacleImg = new Image();
        placedObstacleImg.src = OBSTACLE_PLACED_SRC;

        // Preload toàn bộ các frame ảnh hoạt hoạ cho từng nhân vật
        const charImages = {};
        characters.forEach(char => {
            charImages[char.id] = char.frames.map(src => {
                const img = new Image();
                img.src = src;
                return img;
            });
        });

        document.getElementById('hud-shield-img').src = OBSTACLE_PLACED_SRC;

        // Hiển thị ảnh xem trước (khung hình 0) ở màn hình bắt đầu
        document.getElementById('preview-cho').src = characters[0].frames[0];
        document.getElementById('preview-casau').src = characters[1].frames[0];
        document.getElementById('preview-gau').src = characters[2].frames[0];

        let currentBeast = null; 
        let stepIntervalMs = 600;
        let hasObstacles = true;
        
        let grid = [];
        let beastPos = { r: -1, c: -1 };
        let beastPixel = { x: 0, y: 0 };
        let beastAngle = Math.PI; // Mặc định hướng đi xuống dưới (xuống chuồng gà)
        let frameIndex = 0;      // Chỉ số frame hiện tại
        let frameTimer = 0;      // Bộ đếm thời gian chuyển frame

        let shieldInventory = 2;
        let gameActive = false;
        let startTime = 0;
        let shieldRegenTimer = null;
        let doorOpenTimeout = null;

        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const shieldCountEl = document.getElementById('shield-count');
        const doorsBarEl = document.getElementById('doors-grid-bar');

        let cellW = 0;
        let cellH = 0;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width || canvas.clientWidth || 300;
            canvas.height = rect.height || canvas.clientHeight || 450;
            cellW = canvas.width / COLS;
            cellH = canvas.height / ROWS;
        }

        window.addEventListener('resize', resizeCanvas);

        function setSpeed(ms, element) {
            stepIntervalMs = ms;
            document.querySelectorAll('.speed-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('result-modal').style.display = 'none';

            document.getElementById('hud-char-name').textContent = 'Đang chờ...';
            document.getElementById('hud-avatar-img').style.display = 'none';

            resizeCanvas();
            initBoard();
        }

        function initBoard() {
            doorsBarEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
            doorsBarEl.innerHTML = '';
            for (let c = 0; c < COLS; c++) {
                const doorSlot = document.createElement('div');
                doorSlot.className = 'door-slot';
                const doorIdx = spawnCols.indexOf(c);
                if (doorIdx !== -1) {
                    doorSlot.innerHTML = `<div class="door" id="door-${doorIdx}">Cửa ${doorIdx + 1}</div>`;
                }
                doorsBarEl.appendChild(doorSlot);
            }

            grid = Array(ROWS).fill(0).map(() => Array(COLS).fill(0));
            shieldInventory = 2;
            shieldCountEl.textContent = shieldInventory;
            gameActive = false;

            if (hasObstacles) {
                let count = 0;
                let maxObstacles = Math.floor(COLS * ROWS * 0.08);
                while (count < maxObstacles) {
                    let randR = Math.floor(Math.random() * (ROWS - 2)) + 1;
                    let randC = Math.floor(Math.random() * COLS);
                    if (grid[randR][randC] === 0) {
                        grid[randR][randC] = 2;
                        count++;
                    }
                }
            }

            doorOpenTimeout = setTimeout(() => {
                startSpawning();
            }, 2000);
        }

        function startSpawning() {
            const randomCharIndex = Math.floor(Math.random() * characters.length);
            currentBeast = characters[randomCharIndex];

            const hudAvatarImg = document.getElementById('hud-avatar-img');
            hudAvatarImg.src = currentBeast.frames[0];
            hudAvatarImg.style.display = 'block';
            document.getElementById('hud-char-name').textContent = currentBeast.name;

            const doorIndex = Math.floor(Math.random() * 3);
            const doorEl = document.getElementById(`door-${doorIndex}`);
            if (doorEl) {
                doorEl.classList.add('open');
                doorEl.textContent = 'MỞ!';
            }

            const startCol = spawnCols[doorIndex];
            beastPos = { r: 0, c: startCol };
            beastPixel = { 
                x: startCol * cellW + cellW / 2, 
                y: 0 * cellH + cellH / 2 
            };
            beastAngle = Math.PI; // Ban đầu xoay đầu đi xuống dưới
            frameIndex = 0;

            gameActive = true;
            startTime = Date.now();

            if (shieldRegenTimer) clearInterval(shieldRegenTimer);
            shieldRegenTimer = setInterval(regenShield, 1000);
        }

        function handleInput(clientX, clientY) {
            if (!gameActive || shieldInventory <= 0) return;
            const rect = canvas.getBoundingClientRect();
            const c = Math.floor((clientX - rect.left) / cellW);
            const r = Math.floor((clientY - rect.top) / cellH);

            if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
            if (grid[r][c] !== 0) return;
            if (beastPos.r === r && beastPos.c === c) return;

            grid[r][c] = 1;
            shieldInventory--;
            shieldCountEl.textContent = shieldInventory;

            if (checkTrapped()) {
                endGame(true);
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            handleInput(e.clientX, e.clientY);
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                handleInput(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        function regenShield() {
            if (!gameActive) return;
            shieldInventory++;
            shieldCountEl.textContent = shieldInventory;
        }

        function findShortestPath(start) {
            let queue = [[start]];
            let visited = Array(ROWS).fill(false).map(() => Array(COLS).fill(false));
            visited[start.r][start.c] = true;

            const dirs = [{r: 1, c: 0}, {r: 0, c: -1}, {r: 0, c: 1}, {r: -1, c: 0}];

            while (queue.length > 0) {
                let path = queue.shift();
                let curr = path[path.length - 1];

                if (curr.r === ROWS - 1) return path;

                for (let d of dirs) {
                    let nr = curr.r + d.r;
                    let nc = curr.c + d.c;

                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                        if (!visited[nr][nc] && grid[nr][nc] === 0) {
                            visited[nr][nc] = true;
                            queue.push([...path, {r: nr, c: nc}]);
                        }
                    }
                }
            }
            return null;
        }

        function checkTrapped() {
            return findShortestPath(beastPos) === null;
        }

        function update() {
            if (!gameActive) return;

            let path = findShortestPath(beastPos);

            if (!path) {
                endGame(true);
                return;
            }

            if (path.length > 1) {
                let targetX = path[1].c * cellW + cellW / 2;
                let targetY = path[1].r * cellH + cellH / 2;

                let dx = targetX - beastPixel.x;
                let dy = targetY - beastPixel.y;
                let dist = Math.hypot(dx, dy);

                // Tính toán góc quay của cơ thể dựa trên hướng di chuyển (dx, dy)
                if (dist > 0.001) {
                    // Math.atan2(dy, dx) cho ra góc tương ứng (+ Math.PI/2 để căn đỉnh ảnh lên trên)
                    beastAngle = Math.atan2(dy, dx) + Math.PI / 2;
                }

                let speed = (cellH / (stepIntervalMs / 1000)) / 60;

                if (dist <= speed) {
                    beastPixel.x = targetX;
                    beastPixel.y = targetY;
                    beastPos = path[1];

                    if (beastPos.r === ROWS - 1) {
                        endGame(false);
                    } else if (checkTrapped()) {
                        endGame(true);
                    }
                } else {
                    beastPixel.x += (dx / dist) * speed;
                    beastPixel.y += (dy / dist) * speed;

                    // Hoạt hoạ chuyển ảnh khung hình (Frame Animation) khi di chuyển
                    frameTimer++;
                    if (frameTimer >= 8) { // Cứ sau 8 frame render sẽ đổi 1 ảnh
                        frameTimer = 0;
                        if (currentBeast && currentBeast.frames.length > 0) {
                            frameIndex = (frameIndex + 1) % currentBeast.frames.length;
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (cellW <= 0 || cellH <= 0) return;

            // 1. Vẽ đường lưới và chướng ngại vật
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(c * cellW, r * cellH, cellW, cellH);

                    if (grid[r][c] === 1) { // Chướng ngại vật do NGƯỜI CHƠI ĐẶT
                        if (placedObstacleImg.complete && placedObstacleImg.naturalWidth !== 0) {
                            ctx.drawImage(placedObstacleImg, c * cellW + 2, r * cellH + 2, cellW - 4, cellH - 4);
                        } else {
                            ctx.fillStyle = '#d35400';
                            ctx.fillRect(c * cellW + 2, r * cellH + 2, cellW - 4, cellH - 4);
                        }
                    } else if (grid[r][c] === 2) { // Chướng ngại vật NGẪU NHIÊN
                        if (randomObstacleImg.complete && randomObstacleImg.naturalWidth !== 0) {
                            ctx.drawImage(randomObstacleImg, c * cellW + 2, r * cellH + 2, cellW - 4, cellH - 4);
                        } else {
                            ctx.font = `${cellH * 0.55}px Arial, sans-serif`;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillText('🪨', c * cellW + cellW / 2, r * cellH + cellH / 2);
                        }
                    }
                }
            }

            // 2. Vẽ thú dữ xoay hướng cơ thể & hoạt hoạ từng khung hình
            if (gameActive && currentBeast) {
                const images = charImages[currentBeast.id];
                const img = images ? images[frameIndex % images.length] : null;
                
                ctx.save();
                ctx.translate(beastPixel.x, beastPixel.y);
                
                // Xoay canvas theo hướng di chuyển + góc lệch mặc định của nhân vật
                ctx.rotate(beastAngle + (currentBeast.baseAngle || 0));

                if (img && img.complete && img.naturalWidth !== 0) {
                    const size = cellH * 0.99;
                    ctx.drawImage(img, -size / 2, -size / 2, size, size);
                }

                ctx.restore();
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function endGame(isWin) {
            gameActive = false;
            clearInterval(shieldRegenTimer);
            clearTimeout(doorOpenTimeout);

            const elapsedSec = Math.floor((Date.now() - startTime) / 1000);
            const modal = document.getElementById('result-modal');
            const titleEl = document.getElementById('result-title');
            const timeEl = document.getElementById('result-time');

            if (isWin) {
                titleEl.textContent = 'BẠN ĐÃ THẮNG!';
                titleEl.className = 'result-title win';
                timeEl.textContent = `Đã vây kín ${currentBeast ? currentBeast.name : 'thú dữ'} trong ${elapsedSec} giây!`;
            } else {
                titleEl.textContent = 'BẠN ĐÃ THUA!';
                titleEl.className = 'result-title lose';
                timeEl.textContent = `${currentBeast ? currentBeast.name : 'Thú dữ'} đã chạm chuồng gà sau ${elapsedSec} giây.`;
            }

            modal.style.display = 'flex';
        }

        function resetToStart() {
            clearInterval(shieldRegenTimer);
            clearTimeout(doorOpenTimeout);
            document.getElementById('result-modal').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
        }

        gameLoop();
    </script>
</body>
</html>
