<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ngăn Chuột Ăn Bánh Mì</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; touch-action: none; }
    
    #game-container { position: relative; width: 400px; }
    
    #header-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: #1e1e1e; padding: 10px 16px; border-radius: 12px 12px 0 0;
      border: 1px solid #333; border-bottom: none; height: 50px;
    }

    .btn {
      padding: 8px 14px; font-size: 13px; font-weight: 700; border: none; border-radius: 8px;
      cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 10;
    }
    .btn-secondary { background: #252525; color: #00d2d3; border: 1px solid #00d2d3; }
    .btn-secondary:hover { background: #00d2d3; color: #121212; }
    
    /* Overlay Màn hình bắt đầu */
    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(3px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 20; border-radius: 12px;
    }
    .btn-start-center {
      padding: 16px 32px; font-size: 20px; font-weight: 800;
      background: linear-gradient(135deg, #ff9f43, #ee5253); color: #fff;
      border: none; border-radius: 50px; cursor: pointer;
      box-shadow: 0 6px 20px rgba(238, 82, 83, 0.5); transition: transform 0.2s;
    }
    .btn-start-center:hover { transform: scale(1.08); }

    /* Bảng Kết Quả Thắng / Thua Modal Popup */
    #result-modal {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px);
      flex-direction: column; align-items: center; justify-content: center;
      z-index: 30; border-radius: 12px; animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

    .modal-card {
      background: #222; border: 2px solid #444; border-radius: 16px;
      padding: 24px 32px; text-align: center; width: 80%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .result-title { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
    .result-title.win { color: #2ed573; }
    .result-title.lose { color: #ff4757; }
    .result-time { font-size: 16px; color: #ccc; margin-bottom: 20px; }

    #status { text-align: center; font-size: 13px; font-weight: 600; color: #feca57; width: 100%; }

    canvas { background: #222; border: 2px solid #333; border-radius: 0 0 12px 12px; display: block; }

    /* Widget tấm chắn góc trên bên phải */
    #shield-widget {
      position: absolute; top: 8px; right: 12px; width: 44px; height: 44px;
      background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(4px);
      border-radius: 50%; border: 2px solid #444;
      display: flex; align-items: center; justify-content: center; z-index: 10;
    }
    #cooldown-svg { position: absolute; top: -2px; left: -2px; width: 44px; height: 44px; transform: rotate(-90deg); }
    #cooldown-circle {
      fill: none; stroke: #ff9f43; stroke-width: 3.5;
      stroke-dasharray: 120; stroke-dashoffset: 0; transition: stroke-dashoffset 0.05s linear;
    }
    #shield-preview { background: #eccc68; border-radius: 2px; transition: all 0.2s ease; }
    .preview-vertical { width: 8px; height: 18px; }
    .preview-horizontal { width: 18px; height: 8px; }
  </style>
</head>
<body>

<div id="game-container">
  <div id="header-bar">
    <button id="rotateBtn" class="btn btn-secondary" onclick="toggleRotate()">🔄 Xoay</button>
    <div id="status">Bấm Bắt đầu để chơi</div>
  </div>

  <div id="shield-widget">
    <svg id="cooldown-svg">
      <circle id="cooldown-circle" cx="22" cy="22" r="19"></circle>
    </svg>
    <div id="shield-preview" class="preview-vertical"></div>
  </div>

  <!-- Nút Bắt Đầu nổi -->
  <div id="start-overlay">
    <button class="btn-start-center" onclick="startGame()">▶ BẮT ĐẦU</button>
  </div>

  <!-- Bảng Thông Báo Thắng / Thua -->
  <div id="result-modal">
    <div class="modal-card">
      <div id="modal-title" class="result-title">THẮNG!</div>
      <div id="modal-time" class="result-time">Thời gian: 0.0s</div>
      <button class="btn-start-center" style="font-size: 16px; padding: 12px 28px;" onclick="restartGame()">🔄 CHƠI LẠI</button>
    </div>
  </div>

  <canvas id="gameCanvas" width="400" height="600"></canvas>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  const COLS = 10, ROWS = 15;
  const CELL = canvas.width / COLS;

  let grid = []; 
  let mouse = { x: 0, y: 0, active: false, speed: 0 };
  let doors = [1, 4, 8];
  let selectedDoor = 4;
  let gameRunning = false;
  let startTime = 0, elapsedTime = 0;
  let isHorizontal = false; 
  let canPlace = false;

  const COOLDOWN_TIME = 1000;
  let cooldownStart = 0;

  const circle = document.getElementById('cooldown-circle');
  const preview = document.getElementById('shield-preview');
  const startOverlay = document.getElementById('start-overlay');
  const resultModal = document.getElementById('result-modal');
  const modalTitle = document.getElementById('modal-title');
  const modalTime = document.getElementById('modal-time');
  const maxDash = 120;

  function initGrid() {
    grid = Array(ROWS).fill(0).map(() => Array(COLS).fill(0));
    for(let c = 0; c < COLS; c++) grid[ROWS-1][c] = 2;
  }

  function toggleRotate() {
    isHorizontal = !isHorizontal;
    preview.className = isHorizontal ? 'preview-horizontal' : 'preview-vertical';
  }

  function updateCooldownRing() {
    if (!canPlace && gameRunning) {
      let now = Date.now();
      let progress = (now - cooldownStart) / COOLDOWN_TIME;
      if (progress > 1) progress = 1;
      
      circle.style.strokeDashoffset = maxDash * (1 - progress);

      if (progress < 1) {
        requestAnimationFrame(updateCooldownRing);
      } else {
        circle.style.strokeDashoffset = 0;
        preview.style.opacity = "1";
      }
    } else {
      circle.style.strokeDashoffset = 0;
      preview.style.opacity = "1";
    }
  }

  function startCooldown() {
    canPlace = false;
    cooldownStart = Date.now();
    preview.style.opacity = "0.3";
    circle.style.strokeDashoffset = maxDash;
    updateCooldownRing();

    setTimeout(() => {
      if (gameRunning) {
        canPlace = true;
        preview.style.opacity = "1";
      }
    }, COOLDOWN_TIME);
  }

  function startGame() {
    initGrid();
    gameRunning = true;
    canPlace = true;
    preview.style.opacity = "1";
    circle.style.strokeDashoffset = 0;
    
    startOverlay.style.display = 'none';
    resultModal.style.display = 'none';
    
    selectedDoor = doors[Math.floor(Math.random() * doors.length)];
    
    mouse = {
      x: selectedDoor * CELL + CELL / 2,
      y: 0 + CELL / 2,
      active: false,
      speed: (canvas.height / 9) / 60 
    };

    document.getElementById('status').innerText = "⏳ Chuột xuất hiện sau 3s...";

    setTimeout(() => {
      if (gameRunning) {
        mouse.active = true;
        startTime = Date.now();
        document.getElementById('status').innerText = "🐭 Chặn chuột ngay!";
      }
    }, 3000);
  }

  function showResult(isWin) {
    gameRunning = false;
    modalTitle.innerText = isWin ? "🎉 BẠN THẮNG!" : "💀 BẠN THUA!";
    modalTitle.className = `result-title ${isWin ? 'win' : 'lose'}`;
    modalTime.innerText = isWin 
      ? `Đã vây kín chuột trong ${elapsedTime}s` 
      : `Chuột đã ăn mất bánh mì sau ${elapsedTime}s`;
    
    resultModal.style.display = 'flex';
  }

  function restartGame() {
    startGame();
  }

  function findPath(startX, startY) {
    let startNode = { x: Math.floor(startX / CELL), y: Math.floor(startY / CELL) };
    let queue = [[startNode]];
    let visited = new Set();
    visited.add(`${startNode.x},${startNode.y}`);

    while(queue.length > 0) {
      let path = queue.shift();
      let curr = path[path.length - 1];

      if (curr.y === ROWS - 1) return path;

      let neighbors = [
        {x: curr.x, y: curr.y + 1},
        {x: curr.x - 1, y: curr.y},
        {x: curr.x + 1, y: curr.y},
        {x: curr.x, y: curr.y - 1}
      ];

      for (let n of neighbors) {
        if (n.x >= 0 && n.x < COLS && n.y >= 0 && n.y < ROWS) {
          if (grid[n.y][n.x] !== 1 && !visited.has(`${n.x},${n.y}`)) {
            visited.add(`${n.x},${n.y}`);
            queue.push([...path, n]);
          }
        }
      }
    }
    return null;
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (!gameRunning || !canPlace) return;

    const rect = canvas.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / CELL);
    const r = Math.floor((e.clientY - rect.top) / CELL);

    let cellsToBlock = isHorizontal ? [[r, c], [r, c + 1]] : [[r, c], [r + 1, c]];

    let valid = cellsToBlock.every(([nr, nc]) => 
      nr >= 0 && nr < ROWS - 1 && nc >= 0 && nc < COLS && grid[nr][nc] === 0
    );

    if (valid) {
      cellsToBlock.forEach(([nr, nc]) => grid[nr][nc] = 1);
      startCooldown();
    }
  });

  function update() {
    if (!gameRunning) return;

    if (mouse.active) {
      elapsedTime = ((Date.now() - startTime) / 1000).toFixed(1);
      let path = findPath(mouse.x, mouse.y);

      if (!path) {
        showResult(true); // Báo Thắng
        return;
      }

      if (path.length > 1) {
        let targetX = path[1].x * CELL + CELL / 2;
        let targetY = path[1].y * CELL + CELL / 2;

        let dx = targetX - mouse.x;
        let dy = targetY - mouse.y;
        let dist = Math.hypot(dx, dy);

        if (dist < mouse.speed) {
          mouse.x = targetX;
          mouse.y = targetY;
        } else {
          mouse.x += (dx / dist) * mouse.speed;
          mouse.y += (dy / dist) * mouse.speed;
        }
      }

      if (Math.floor(mouse.y / CELL) >= ROWS - 1) {
        showResult(false); // Báo Thua
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c] === 1) {
          ctx.fillStyle = '#eccc68';
          ctx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2);
        } else if (grid[r][c] === 2) {
          ctx.fillStyle = '#ffbe76';
          ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
        }
      }
    }

    ctx.fillStyle = '#222';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText("🥖 KHO BÁNH MÌ 🥖", canvas.width / 2, canvas.height - 12);

    doors.forEach(d => {
      ctx.fillStyle = (d === selectedDoor && gameRunning) ? '#ff4757' : '#54a0ff';
      ctx.fillRect(d * CELL, 0, CELL, 8);
    });

    if (gameRunning) {
      ctx.font = '24px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🐭', mouse.x, mouse.y);
    }
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  initGrid();
  gameLoop();
</script>
</body>
</html>
