<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mewing vs Fanum Tax - Brainrot Edition</title>
  <style>
    * { box-sizing: border-box; font-family: 'Impact', 'Segoe UI', sans-serif; user-select: none; }
    html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #0f0c20; color: #fff; touch-action: none; }
    
    #game-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    
    #header-bar {
      position: absolute; top: 0; left: 0; width: 100%; height: 50px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(20, 15, 35, 0.9); padding: 0 16px; border-bottom: 2px solid #a55eea; z-index: 10;
    }

    .btn {
      padding: 10px 18px; font-size: 14px; font-weight: 900; border: none; border-radius: 50px;
      cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 12px rgba(165, 94, 234, 0.5); z-index: 15; letter-spacing: 1px;
    }
    .btn-secondary { background: #2d1b4e; color: #00d2d3; border: 2px solid #00d2d3; }
    .btn-secondary:active { transform: scale(0.92); background: #00d2d3; color: #121212; }
    
    #rotateBtn { position: absolute; bottom: 25px; left: 20px; }

    /* Overlay Bắt Đầu */
    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 12, 32, 0.85); backdrop-filter: blur(8px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 20;
    }
    .brainrot-title { font-size: 32px; color: #ff007f; text-shadow: 0 0 10px #ff007f, 0 0 20px #a55eea; margin-bottom: 20px; text-align: center; }
    
    .btn-start-center {
      padding: 16px 36px; font-size: 24px; font-weight: 900;
      background: linear-gradient(135deg, #ff007f, #a55eea); color: #fff;
      border: none; border-radius: 50px; cursor: pointer;
      box-shadow: 0 6px 25px rgba(255, 0, 127, 0.6); transition: transform 0.2s;
    }
    .btn-start-center:hover { transform: scale(1.08) rotate(-2deg); }

    /* Modal Kết Quả */
    #result-modal {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 5, 20, 0.9); backdrop-filter: blur(8px);
      flex-direction: column; align-items: center; justify-content: center;
      z-index: 30; animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

    .modal-card {
      background: #1a102f; border: 3px solid #a55eea; border-radius: 20px;
      padding: 24px 32px; text-align: center; width: 85%; max-width: 360px;
      box-shadow: 0 0 30px rgba(165, 94, 234, 0.5);
    }
    .result-title { font-size: 28px; font-weight: 900; margin-bottom: 8px; letter-spacing: 1px; }
    .result-title.win { color: #00ff88; text-shadow: 0 0 10px #00ff88; }
    .result-title.lose { color: #ff4757; text-shadow: 0 0 10px #ff4757; }
    .result-time { font-size: 16px; color: #d1d8e0; margin-bottom: 20px; font-family: sans-serif; }

    #status { text-align: center; font-size: 14px; font-weight: 700; color: #00d2d3; width: 100%; letter-spacing: 1px; }

    canvas { background: #160d29; display: block; margin-top: 50px; border-bottom: 3px solid #a55eea; }

    /* Widget đếm ngược */
    #shield-widget {
      position: absolute; top: 50%; right: 15px; transform: translateY(-50%);
      width: 50px; height: 50px; background: rgba(30, 20, 50, 0.5); backdrop-filter: blur(4px);
      border-radius: 50%; border: 2px solid #a55eea; display: flex; align-items: center; justify-content: center;
      z-index: 10; pointer-events: none;
    }
    #cooldown-svg { position: absolute; top: -2px; left: -2px; width: 50px; height: 50px; transform: rotate(-90deg); }
    #cooldown-circle {
      fill: none; stroke: #ff007f; stroke-width: 4;
      stroke-dasharray: 138; stroke-dashoffset: 0; transition: stroke-dashoffset 0.05s linear;
    }
    #shield-preview { background: #00d2d3; border-radius: 4px; box-shadow: 0 0 8px #00d2d3; transition: all 0.2s ease; }
    .preview-vertical { width: 8px; height: 22px; }
    .preview-horizontal { width: 22px; height: 8px; }
  </style>
</head>
<body>

<div id="game-container">
  <div id="header-bar">
    <div id="status">BẮT ĐẦU ĐỂ CHẶN MEWING CAT</div>
  </div>

  <button id="rotateBtn" class="btn btn-secondary" onclick="toggleRotate()">🔄 ROTATE (Space)</button>

  <div id="shield-widget">
    <svg id="cooldown-svg">
      <circle id="cooldown-circle" cx="25" cy="25" r="22"></circle>
    </svg>
    <div id="shield-preview" class="preview-vertical"></div>
  </div>

  <div id="start-overlay">
    <div class="brainrot-title">SKIBIDI BRAINROT 🗿</div>
    <button class="btn-start-center" onclick="requestFullScreenAndStart()">▶ CHƠI NGAY</button>
  </div>

  <div id="result-modal">
    <div class="modal-card">
      <div id="modal-title" class="result-title">THẮNG!</div>
      <div id="modal-time" class="result-time">Thời gian: 0.0s</div>
      <button class="btn-start-center" style="font-size: 16px; padding: 12px 28px;" onclick="restartGame()">🔄 CHƠI LẠI</button>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  const COLS = 10, ROWS = 15;
  let CELL = 40;

  let grid = []; 
  let mouse = { x: 0, y: 0, active: false, speed: 0 };
  let doors = [1, 4, 8];
  let selectedDoor = 4;
  let gameRunning = false;
  let startTime = 0, elapsedTime = 0;
  let isHorizontal = false; 
  let canPlace = false;

  const COOLDOWN_TIME = 1500;
  let cooldownStart = 0;

  const circle = document.getElementById('cooldown-circle');
  const preview = document.getElementById('shield-preview');
  const startOverlay = document.getElementById('start-overlay');
  const resultModal = document.getElementById('result-modal');
  const modalTitle = document.getElementById('modal-title');
  const modalTime = document.getElementById('modal-time');
  const maxDash = 138;

  function resizeCanvas() {
    const availableWidth = window.innerWidth;
    const availableHeight = window.innerHeight - 50;
    
    const cellW = availableWidth / COLS;
    const cellH = availableHeight / ROWS;
    CELL = Math.min(cellW, cellH);

    canvas.width = CELL * COLS;
    canvas.height = CELL * ROWS;
  }

  function requestFullScreenAndStart() {
    const elem = document.documentElement;
    if (elem.requestFullscreen) {
      elem.requestFullscreen().catch(() => {});
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    }
    
    setTimeout(() => {
      resizeCanvas();
      startGame();
    }, 100);
  }

  window.addEventListener('resize', resizeCanvas);

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      toggleRotate();
    }
  });

  function initGrid() {
    grid = Array(ROWS).fill(0).map(() => Array(COLS).fill(0));
    for(let c = 0; c < COLS; c++) grid[ROWS-1][c] = 2;
  }

  function toggleRotate() {
    isHorizontal = !isHorizontal;
    preview.className = isHorizontal ? 'preview-horizontal' : 'preview-vertical';
  }

  function updateCooldownRing() {
    if (!canPlace && gameRunning) {
      let now = Date.now();
      let progress = (now - cooldownStart) / COOLDOWN_TIME;
      if (progress > 1) progress = 1;
      
      circle.style.strokeDashoffset = maxDash * (1 - progress);

      if (progress < 1) {
        requestAnimationFrame(updateCooldownRing);
      } else {
        circle.style.strokeDashoffset = 0;
        preview.style.opacity = "1";
      }
    } else {
      circle.style.strokeDashoffset = 0;
      preview.style.opacity = "1";
    }
  }

  function startCooldown() {
    canPlace = false;
    cooldownStart = Date.now();
    preview.style.opacity = "0.3";
    circle.style.strokeDashoffset = maxDash;
    updateCooldownRing();

    setTimeout(() => {
      if (gameRunning) {
        canPlace = true;
        preview.style.opacity = "1";
      }
    }, COOLDOWN_TIME);
  }

  function startGame() {
    initGrid();
    gameRunning = true;
    canPlace = true;
    preview.style.opacity = "1";
    circle.style.strokeDashoffset = 0;
    
    startOverlay.style.display = 'none';
    resultModal.style.display = 'none';
    
    selectedDoor = doors[Math.floor(Math.random() * doors.length)];
    
    mouse = {
      x: selectedDoor * CELL + CELL / 2,
      y: 0 + CELL / 2,
      active: false,
      speed: (canvas.height / 6) / 60 
    };

    document.getElementById('status').innerText = "🤫 MEWING CAT XUẤT HIỆN SAU 3S...";

    setTimeout(() => {
      if (gameRunning) {
        mouse.active = true;
        startTime = Date.now();
        document.getElementById('status').innerText = "🗿 BLOCK MEWING CAT NGAY!";
      }
    }, 3000);
  }

  function showResult(isWin) {
    gameRunning = false;
    modalTitle.innerText = isWin ? "🔥 +9999 RIZZ!" : "💀 L + RATIO + BRAINROT";
    modalTitle.className = `result-title ${isWin ? 'win' : 'lose'}`;
    modalTime.innerText = isWin 
      ? `Bảo vệ thành công Pizza khỏi Fanum Tax trong ${elapsedTime}s` 
      : `Bị Mewing Cat ăn mất Pizza sau ${elapsedTime}s`;
    
    resultModal.style.display = 'flex';
  }

  function restartGame() {
    startGame();
  }

  function findPath(startX, startY) {
    let startNode = { x: Math.floor(startX / CELL), y: Math.floor(startY / CELL) };
    let queue = [[startNode]];
    let visited = new Set();
    visited.add(`${startNode.x},${startNode.y}`);

    while(queue.length > 0) {
      let path = queue.shift();
      let curr = path[path.length - 1];

      if (curr.y === ROWS - 1) return path;

      let neighbors = [
        {x: curr.x, y: curr.y + 1},
        {x: curr.x - 1, y: curr.y},
        {x: curr.x + 1, y: curr.y},
        {x: curr.x, y: curr.y - 1}
      ];

      for (let n of neighbors) {
        if (n.x >= 0 && n.x < COLS && n.y >= 0 && n.y < ROWS) {
          if (grid[n.y][n.x] !== 1 && !visited.has(`${n.x},${n.y}`)) {
            visited.add(`${n.x},${n.y}`);
            queue.push([...path, n]);
          }
        }
      }
    }
    return null;
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (!gameRunning || !canPlace) return;

    const rect = canvas.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / CELL);
    const r = Math.floor((e.clientY - rect.top) / CELL);

    let cellsToBlock = isHorizontal ? [[r, c], [r, c + 1]] : [[r, c], [r + 1, c]];

    let valid = cellsToBlock.every(([nr, nc]) => 
      nr >= 0 && nr < ROWS - 1 && nc >= 0 && nc < COLS && grid[nr][nc] === 0
    );

    if (valid) {
      cellsToBlock.forEach(([nr, nc]) => grid[nr][nc] = 1);
      startCooldown();
    }
  });

  function update() {
    if (!gameRunning) return;

    if (mouse.active) {
      elapsedTime = ((Date.now() - startTime) / 1000).toFixed(1);
      let path = findPath(mouse.x, mouse.y);

      if (!path) {
        showResult(true);
        return;
      }

      if (path.length > 1) {
        let targetX = path[1].x * CELL + CELL / 2;
        let targetY = path[1].y * CELL + CELL / 2;

        let dx = targetX - mouse.x;
        let dy = targetY - mouse.y;
        let dist = Math.hypot(dx, dy);

        if (dist < mouse.speed) {
          mouse.x = targetX;
          mouse.y = targetY;
        } else {
          mouse.x += (dx / dist) * mouse.speed;
          mouse.y += (dy / dist) * mouse.speed;
        }
      }

      if (Math.floor(mouse.y / CELL) >= ROWS - 1) {
        showResult(false);
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c] === 1) {
          // Khối tường Sigma
          ctx.fillStyle = '#00d2d3';
          ctx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2);
          
          ctx.fillStyle = '#121212';
          ctx.font = `${CELL * 0.4}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('🗿', c * CELL + CELL / 2, r * CELL + CELL / 2);
        } else if (grid[r][c] === 2) {
          // Khu vực Fanum Tax Pizza
          ctx.fillStyle = '#ff007f';
          ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
        }
      }
    }

    ctx.fillStyle = '#fff';
    ctx.font = `900 ${Math.max(10, CELL * 0.35)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText("🍕 FANUM TAX PIZZA 🍕", canvas.width / 2, canvas.height - CELL * 0.3);

    doors.forEach(d => {
      ctx.fillStyle = (d === selectedDoor && gameRunning) ? '#ff007f' : '#a55eea';
      ctx.fillRect(d * CELL, 0, CELL, 8);
    });

    if (gameRunning) {
      // Mewing Cat / Skibidi
      ctx.font = `${CELL * 0.75}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🐱', mouse.x, mouse.y);
    }
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  resizeCanvas();
  initGrid();
  gameLoop();
</script>
</body>
</html>
