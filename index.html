<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ngăn Chuột Ăn Bánh Mì</title>
  <style>
    body { margin: 0; background: #1e1e1e; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; touch-action: none; }
    #ui { margin-bottom: 10px; display: flex; gap: 15px; align-items: center; background: #2d2d2d; padding: 10px 20px; border-radius: 8px; }
    canvas { background: #333; border: 3px solid #555; }
    button { padding: 8px 16px; background: #ffa500; color: #000; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #555; color: #888; }
    #status { font-weight: bold; color: #4cd137; }
  </style>
</head>
<body>

<div id="ui">
  <button id="startBtn" onclick="startGame()">Bắt đầu (Start)</button>
  <button id="rotateBtn" onclick="toggleRotate()">Xoay tấm chắn (Hiện: Dọc)</button>
  <span id="status">Bấm Start để chơi</span>
</div>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  const COLS = 10, ROWS = 15;
  const CELL = canvas.width / COLS; // 40px mỗi ô

  let grid = []; 
  let mouse = { x: 0, y: 0, path: [], active: false, speed: 0 };
  let doors = [1, 4, 8]; // 3 vị trí cửa ngẫu nhiên ở hàng trên cùng
  let selectedDoor = 4;
  let gameRunning = false;
  let startTime = 0, elapsedTime = 0;
  let isHorizontal = false; // Tấm chắn mặc định là Dọc (1x2)
  let canPlace = false;
  let cooldownTimer = null;

  function initGrid() {
    grid = Array(ROWS).fill(0).map(() => Array(COLS).fill(0));
    // Đáy màn hình là kho Bánh Mì (Hàng cuối)
    for(let c=0; c<COLS; c++) grid[ROWS-1][c] = 2; // 2: Bánh mì
  }

  function toggleRotate() {
    isHorizontal = !isHorizontal;
    document.getElementById('rotateBtn').innerText = `Xoay tấm chắn (Hiện: ${isHorizontal ? 'Ngang' : 'Dọc'})`;
  }

  function startGame() {
    initGrid();
    gameRunning = true;
    canPlace = true; // Cho phép đặt 1 tấm ngay khi Start
    selectedDoor = doors[Math.floor(Math.random() * doors.length)];
    
    mouse = {
      x: selectedDoor * CELL + CELL/2,
      y: 0 + CELL/2,
      active: false,
      speed: (canvas.height / 3) / 60 // 3 giây đi hết chiều dọc (~60fps)
    };

    document.getElementById('startBtn').disabled = true;
    document.getElementById('status').innerText = "Chuột sẽ xuất hiện sau 3 giây...";

    // 3 giây sau chuột bắt đầu chạy
    setTimeout(() => {
      if (gameRunning) {
        mouse.active = true;
        startTime = Date.now();
        document.getElementById('status').innerText = "Ngăn chuột lại!";
      }
    }, 3000);
  }

  // Thuật toán A* tìm đường đi ngắn nhất cho chuột
  function findPath(startX, startY) {
    let startNode = { x: Math.floor(startX / CELL), y: Math.floor(startY / CELL) };
    let queue = [[startNode]];
    let visited = new Set();
    visited.add(`${startNode.x},${startNode.y}`);

    while(queue.length > 0) {
      let path = queue.shift();
      let curr = path[path.length - 1];

      if (curr.y === ROWS - 1) return path; // Đã chạm kho bánh mì

      let neighbors = [
        {x: curr.x, y: curr.y + 1}, // Xuống
        {x: curr.x - 1, y: curr.y}, // Trái
        {x: curr.x + 1, y: curr.y}, // Phải
        {x: curr.x, y: curr.y - 1}  // Lên
      ];

      for (let n of neighbors) {
        if (n.x >= 0 && n.x < COLS && n.y >= 0 && n.y < ROWS) {
          if (grid[n.y][n.x] !== 1 && !visited.has(`${n.x},${n.y}`)) { // 1: Tấm chắn
            visited.add(`${n.x},${n.y}`);
            queue.push([...path, n]);
          }
        }
      }
    }
    return null; // Không có đường đi (Chuột bị vây kín)
  }

  // Xử lý sự kiện bấm đặt Tấm Chắn
  canvas.addEventListener('pointerdown', (e) => {
    if (!gameRunning || !canPlace) return;

    const rect = canvas.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / CELL);
    const r = Math.floor((e.clientY - rect.top) / CELL);

    // Xác định 2 ô đặt tấm chắn (Ngang: 2x1, Dọc: 1x2)
    let cellsToBlock = isHorizontal ? [[r, c], [r, c + 1]] : [[r, c], [r + 1, c]];

    // Kiểm tra hợp lệ
    let valid = cellsToBlock.every(([nr, nc]) => 
      nr >= 0 && nr < ROWS - 1 && nc >= 0 && nc < COLS && grid[nr][nc] === 0
    );

    if (valid) {
      cellsToBlock.forEach(([nr, nc]) => grid[nr][nc] = 1);
      canPlace = false; // Chờ 1.5s cho tấm tiếp theo

      // Đếm ngược 1.5s
      setTimeout(() => { if (gameRunning) canPlace = true; }, 1500);
    }
  });

  function update() {
    if (!gameRunning) return;

    if (mouse.active) {
      elapsedTime = ((Date.now() - startTime) / 1000).toFixed(1);
      
      let path = findPath(mouse.x, mouse.y);

      // THẮNG: Chuột không còn đường đi đến kho bánh mì
      if (!path) {
        gameRunning = false;
        document.getElementById('status').innerText = `THẮNG! Vây kín chuột trong ${elapsedTime}s`;
        document.getElementById('startBtn').disabled = false;
        return;
      }

      // Di chuyển chuột theo đường đi tìm được
      if (path.length > 1) {
        let targetX = path[1].x * CELL + CELL / 2;
        let targetY = path[1].y * CELL + CELL / 2;

        let dx = targetX - mouse.x;
        let dy = targetY - mouse.y;
        let dist = Math.hypot(dx, dy);

        if (dist < mouse.speed) {
          mouse.x = targetX;
          mouse.y = targetY;
        } else {
          mouse.x += (dx / dist) * mouse.speed;
          mouse.y += (dy / dist) * mouse.speed;
        }
      }

      // THUA: Chuột chạm bánh mì (Hàng cuối)
      if (Math.floor(mouse.y / CELL) >= ROWS - 1) {
        gameRunning = false;
        document.getElementById('status').innerText = `THUA! Chuột đã ăn bánh mì sau ${elapsedTime}s`;
        document.getElementById('startBtn').disabled = false;
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Vẽ lưới & Bức tường 2 bên
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (grid[r][c] === 1) {
          ctx.fillStyle = '#eccc68'; // Tấm chắn
          ctx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2);
        } else if (grid[r][c] === 2) {
          ctx.fillStyle = '#ffbe76'; // Kho Bánh mì
          ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
        }
      }
    }

    // Vẽ nhãn Bánh Mì ở đáy
    ctx.fillStyle = '#84817a';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText("🥖 KHO BÁNH MÌ 🥖", canvas.width / 2, canvas.height - 12);

    // 2. Vẽ 3 cánh cửa phía trên
    doors.forEach(d => {
      ctx.fillStyle = (d === selectedDoor && gameRunning) ? '#ff4757' : '#74b9ff';
      ctx.fillRect(d * CELL, 0, CELL, 10);
    });

    // 3. Vẽ Con Chuột
    if (gameRunning) {
      ctx.font = '24px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🐭', mouse.x, mouse.y);
    }
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  initGrid();
  gameLoop();
</script>
</body>
</html>
